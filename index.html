<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Abrindo site oficial...</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    background: #ffffff;
    color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 24px 20px 40px 20px;
    text-align: center;
  }

  .arrow-area {
    position: relative;
    width: 100%;
    height: 90px;
    margin-bottom: 8px;
  }

  /* Seta grande apontando para os três pontinhos, com espaço confortável */
  .arrow {
    position: absolute;
    top: 28px;
    right: 60px;
    width: 70px;
    height: 70px;
  }

  .arrow svg {
    width: 100%;
    height: 100%;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-top: 10px;
    margin-bottom: 22px;
  }

  .instructions {
    max-width: 320px;
    margin-bottom: 8px;
  }

  .instructions p {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .highlight {
    font-weight: 700;
  }

  .note {
    font-size: 14px;
    color: #444444;
    margin-top: 6px;
    margin-bottom: 34px;
  }

</style>
</head>
<body>

  <div class="arrow-area">
    <div class="arrow">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- Seta reta, vermelha e chamativa, apontando para o canto superior direito -->
        <line x1="15" y1="75" x2="70" y2="20" stroke="#e60000" stroke-width="8" stroke-linecap="round"/>
        <!-- Ponta da seta -->
        <polygon points="70,20 50,26 64,40" fill="#e60000"/>
      </svg>
    </div>
  </div>

  <h1>QUASE LÁ! 👇</h1>

  <div class="instructions">
    <p>Para acessar o site oficial, toque nos <span class="highlight">3 pontinhos ⋮</span></p>
    <p>Depois selecione:<br><span class="highlight">Abrir no navegador</span></p>
  </div>

  <p class="note">Você será direcionado automaticamente.</p>

  <script>
    function irParaSiteOficial() {
      window.location.replace("https://jezaotarefa.github.io/tarefasemdolar/");
    }

    // Detecta se a página está aberta dentro do navegador interno do TikTok.
    // O navegador in-app do TikTok inclui "musical_ly" ou "tiktok" no user agent.
    function estaNoNavegadorInternoDoTikTok() {
      var ua = navigator.userAgent || navigator.vendor || "";
      return /musical_ly|tiktok/i.test(ua);
    }

    // Só redireciona automaticamente quando a página é aberta FORA do
    // navegador interno do TikTok (ou seja, já no Chrome/Safari/etc).
    // Dentro do navegador interno, a pessoa fica na página lendo a instrução.
    if (!estaNoNavegadorInternoDoTikTok()) {
      setTimeout(irParaSiteOficial, 1000);
    }
  </script>

</body>
</html>
